<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>satAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      height: calc(100vh - 135px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .ai {
      background: white;
      color: #222;
      margin-right: auto;
      border-bottom-left-radius: 4px;
      border: 1px solid #ddd;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
    }

    #inputArea {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #userInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    #sendBtn {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    #sendBtn:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <header>
    satAI 🤖
  </header>

  <div id="chat">

    <div class="message ai">
      halo gua AI terbagus yaitu satAI 🤖🔥
      ngobrol aja sama gua
    </div>

  </div>

  <div id="inputArea">

    <input
      id="userInput"
      type="text"
      placeholder="Tulis pesan..."
      autocomplete="off"
    >

    <button id="sendBtn">
      Kirim
    </button>

  </div>


  <script>

    // =====================================
    // URL CLOUDFLARE WORKER LU
    // =====================================

    const WORKER_URL =
      "https://satai-server.satriaps343.workers.dev/";


    // =====================================
    // ELEMENT
    // =====================================

    const chat =
      document.getElementById("chat");

    const userInput =
      document.getElementById("userInput");

    const sendBtn =
      document.getElementById("sendBtn");


    // =====================================
    // TAMBAH PESAN
    // =====================================

    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;
    }


    // =====================================
    // KIRIM PESAN
    // =====================================

    async function sendMessage() {

      const pesan =
        userInput.value.trim();

      if (!pesan) return;


      // tampilkan pesan user

      addMessage(pesan, "user");

      userInput.value = "";

      sendBtn.disabled = true;

      sendBtn.textContent = "...";


      // loading

      const loading =
        addMessage(
          "satAI lagi mikir...",
          "ai"
        );


      try {

        const response =
          await fetch(WORKER_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              pesan: pesan
            })

          });


        // cek response

        if (!response.ok) {

          throw new Error(
            "Server error: " +
            response.status
          );

        }


        // ambil JSON

        const data =
          await response.json();


        // ambil jawaban

        const jawaban =
          data.jawaban;


        if (!jawaban) {

          throw new Error(
            "satAI tidak memberikan jawaban"
          );

        }


        // tampilkan jawaban

        loading.textContent =
          jawaban;


      } catch (error) {

        console.error(error);

        loading.classList.add("error");

        loading.textContent =
          "Yah satAI gagal jawab 😭\n\n" +
          error.message;

      } finally {

        sendBtn.disabled = false;

        sendBtn.textContent =
          "Kirim";

        userInput.focus();

      }

    }


    // =====================================
    // TOMBOL KIRIM
    // =====================================

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // =====================================
    // ENTER UNTUK KIRIM
    // =====================================

    userInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
